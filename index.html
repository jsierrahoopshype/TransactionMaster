<!DOCTYPE html>
<html>
<head><title>HoopsMatic TM Diagnostics</title>
<style>
body { font-family: 'DM Sans', sans-serif; background: #f8f9fa; padding: 2rem; max-width: 800px; margin: 0 auto; }
h1 { font-size: 1.2rem; }
.test { background: #fff; border: 1px solid #e2e5e9; border-radius: 8px; padding: 1rem; margin-bottom: .75rem; }
.test-name { font-weight: 700; font-size: .85rem; }
.test-result { font-family: 'JetBrains Mono', monospace; font-size: .75rem; margin-top: .5rem; color: #5a6070; }
.pass { border-left: 4px solid #16a34a; }
.fail { border-left: 4px solid #dc2626; }
.slow { border-left: 4px solid #f59e0b; }
.running { border-left: 4px solid #3b82f6; opacity: .7; }
button { padding: .5rem 1.5rem; font-size: .85rem; border-radius: 6px; border: 1px solid #3b82f6; background: rgba(59,130,246,.1); color: #3b82f6; cursor: pointer; font-weight: 600; }
button:hover { background: #3b82f6; color: #fff; }
#results { margin-top: 1rem; }
</style>
</head>
<body>
<h1>🏀 HoopsMatic Trade Machine — Diagnostics</h1>
<p style="font-size:.8rem;color:#5a6070">Tests each component that loads on hoopsmatic.com to find the bottleneck.</p>
<button onclick="runAll()">Run All Tests</button>
<div id="results"></div>

<script>
const results = document.getElementById('results');

function addResult(name, status, detail) {
  const div = document.createElement('div');
  div.className = 'test ' + status;
  div.innerHTML = `<div class="test-name">${name}</div><div class="test-result">${detail}</div>`;
  results.appendChild(div);
  return div;
}

function updateResult(div, status, detail) {
  div.className = 'test ' + status;
  div.querySelector('.test-result').innerHTML = detail;
}

async function runAll() {
  results.innerHTML = '';

  // Test 1: Page source size
  const t1 = addResult('1. Page HTML size', 'running', 'Fetching hoopsmatic.com...');
  try {
    const start = performance.now();
    const r = await fetch('https://hoopsmatic.com/', { cache: 'no-store' });
    const html = await r.text();
    const ms = (performance.now() - start).toFixed(0);
    const kb = (html.length / 1024).toFixed(0);
    
    // Check injected CSV size
    const csvMatch = html.match(/window\.__INJECTED_CSV_DATA__="([^"]+)"/);
    const csvSize = csvMatch ? (csvMatch[1].length / 1024).toFixed(0) : 'not found';
    const csvDecoded = csvMatch ? (atob(csvMatch[1]).length / 1024).toFixed(0) : '?';
    
    const status = parseInt(kb) > 1000 ? 'slow' : 'pass';
    updateResult(t1, status, `Total HTML: ${kb}KB · Fetch time: ${ms}ms · Injected CSV (base64): ${csvSize}KB · CSV decoded: ${csvDecoded}KB`);
  } catch(e) {
    updateResult(t1, 'fail', 'Error: ' + e.message);
  }

  // Test 2: CSV data fetch directly
  const t2 = addResult('2. Google Sheets CSV fetch', 'running', 'Fetching CSV...');
  try {
    const start = performance.now();
    const r = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vSg6im6IYB6HXMGzQbmmBnLw9SfQLzxCSo8OfChxlJLhsB6BBCO0wPF_TMch0YgAbtFqYkwDWrsxRe7/pub?gid=0&single=true&output=csv');
    const text = await r.text();
    const ms = (performance.now() - start).toFixed(0);
    const kb = (text.length / 1024).toFixed(0);
    const rows = text.split('\n').length;
    const status = parseInt(ms) > 3000 ? 'slow' : 'pass';
    updateResult(t2, status, `CSV size: ${kb}KB · ${rows} rows · Fetch time: ${ms}ms`);
  } catch(e) {
    updateResult(t2, 'fail', 'BLOCKED or error: ' + e.message + ' (CSP may block this — check console)');
  }

  // Test 3: Trade Values CSV
  const t3 = addResult('3. Trade Values CSV fetch', 'running', 'Fetching trade values...');
  try {
    const TV_SHEET_ID = '2PACX-1vSg6im6IYB6HXMGzQbmmBnLw9SfQLzxCSo8OfChxlJLhsB6BBCO0wPF_TMch0YgAbtFqYkwDWrsxRe7';
    const TV_GID = '508947498';
    const start = performance.now();
    const r = await fetch(`https://docs.google.com/spreadsheets/d/e/${TV_SHEET_ID}/pub?gid=${TV_GID}&single=true&output=csv`);
    const text = await r.text();
    const ms = (performance.now() - start).toFixed(0);
    const kb = (text.length / 1024).toFixed(0);
    const status = parseInt(ms) > 3000 ? 'slow' : 'pass';
    updateResult(t3, status, `TV CSV size: ${kb}KB · Fetch time: ${ms}ms`);
  } catch(e) {
    updateResult(t3, 'fail', 'BLOCKED or error: ' + e.message);
  }

  // Test 4: Rumors API
  const t4 = addResult('4. Rumors API fetch', 'running', 'Fetching rumors...');
  try {
    const start = performance.now();
    const r = await fetch('https://hoopshype-rumors-api.thejorgesierra.workers.dev/api/rumors/latest');
    const ms = (performance.now() - start).toFixed(0);
    const ok = r.ok;
    const size = ok ? ((await r.text()).length / 1024).toFixed(0) : 'N/A';
    const status = !ok ? 'fail' : parseInt(ms) > 3000 ? 'slow' : 'pass';
    updateResult(t4, status, `Status: ${r.status} · Size: ${size}KB · Time: ${ms}ms`);
  } catch(e) {
    updateResult(t4, 'fail', 'Error: ' + e.message);
  }

  // Test 5: GitHub HTML fetch (raw)
  const t5 = addResult('5. GitHub TM HTML fetch', 'running', 'Fetching raw HTML from GitHub...');
  try {
    const start = performance.now();
    const r = await fetch('https://raw.githubusercontent.com/jsierrahoopshype/TransactionMaster/main/index.html');
    const text = await r.text();
    const ms = (performance.now() - start).toFixed(0);
    const kb = (text.length / 1024).toFixed(0);
    const hasOffseason = text.includes('IS_OFFSEASON');
    const hasNeedDraft = text.includes('NEED_DRAFT_PICKS');
    const status = hasOffseason ? 'slow' : 'pass';
    updateResult(t5, status, `HTML size: ${kb}KB · Fetch: ${ms}ms · IS_OFFSEASON: ${hasOffseason} · NEED_DRAFT_PICKS: ${hasNeedDraft}`);
  } catch(e) {
    updateResult(t5, 'fail', 'Error: ' + e.message);
  }

  // Test 6: TM in iframe (actual load test)
  const t6 = addResult('6. Full TM load test (iframe)', 'running', 'Loading TM in hidden iframe...');
  try {
    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'width:1px;height:1px;position:absolute;left:-999px';
    const start = performance.now();
    let resolved = false;
    
    const timeout = setTimeout(() => {
      if (!resolved) {
        resolved = true;
        updateResult(t6, 'fail', `TIMEOUT after 15s — TM did not finish loading`);
        iframe.remove();
      }
    }, 15000);

    iframe.onload = () => {
      if (resolved) return;
      resolved = true;
      clearTimeout(timeout);
      const ms = (performance.now() - start).toFixed(0);
      const status = parseInt(ms) > 5000 ? 'slow' : 'pass';
      updateResult(t6, status, `Full page load: ${ms}ms`);
      setTimeout(() => iframe.remove(), 1000);
    };
    
    iframe.src = 'https://hoopsmatic.com/?t=' + Date.now();
    document.body.appendChild(iframe);
  } catch(e) {
    updateResult(t6, 'fail', 'Error: ' + e.message);
  }

  // Test 7: Check what scripts Worker injects
  const t7 = addResult('7. Worker-injected scripts analysis', 'running', 'Analyzing...');
  try {
    const r = await fetch('https://hoopsmatic.com/', { cache: 'no-store' });
    const html = await r.text();
    
    const checks = {
      'Injected CSV': html.includes('__INJECTED_CSV_DATA__'),
      'Nav bar': html.includes('hm-nav'),
      'Mobile team strip (MutationObserver)': html.includes('mobileTradeTeams'),
      'Contract link icons (MutationObserver)': html.includes('hm-ct-icon'),
      'OG meta tags': html.includes('og:title'),
      'Sticky header CSS': html.includes('header{position:sticky'),
      'IS_OFFSEASON': html.includes('IS_OFFSEASON'),
      'NEED_DRAFT_PICKS': html.includes('NEED_DRAFT_PICKS'),
      'seasonToggle': html.includes('seasonToggle'),
    };
    
    let detail = '';
    for (const [name, found] of Object.entries(checks)) {
      detail += `${found ? '✅' : '❌'} ${name}<br>`;
    }
    
    // Count MutationObservers
    const obsCount = (html.match(/MutationObserver/g) || []).length;
    detail += `<br>MutationObservers found: <strong>${obsCount}</strong>`;
    
    // Count script tags
    const scriptCount = (html.match(/<script/g) || []).length;
    detail += `<br>Script tags: <strong>${scriptCount}</strong>`;
    
    updateResult(t7, obsCount > 4 ? 'slow' : 'pass', detail);
  } catch(e) {
    updateResult(t7, 'fail', 'Error: ' + e.message);
  }
}
</script>
</body>
</html>
