# Runs the page's tests on every pull request. The page itself is served
# straight from main by hoopsmatic-worker; this changes nothing about that.
name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: for f in tests/*.test.mjs; do node "$f" || exit 1; done
